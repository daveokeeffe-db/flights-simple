# The main job for flights_project
resources:
  jobs:
    pytest_notebook_job:
      name: pytest_notebook_job_${bundle.target}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../tests/pyspark_testing_notebook.py
            base_parameters:
                catalog: ${var.catalog}
                database: ${var.database}
          max_retries: 0
